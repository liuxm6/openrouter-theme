<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>登录中… · aitokensflux</title>
<!-- 本页挂在 /oauth/<provider> 下，资源必须用根路径，相对路径会解析到 /oauth/ 目录而 404 -->
<script src="/theme-init.js"></script>
<style>
  :root {
    color-scheme: light;
    --canvas: #fafafa; --surface: #ffffff; --border: #ebebeb;
    --text: #171717; --muted: #737373; --accent: #0fb477; --accent-text: #067647; --danger: #b42318;
    --shadow: none;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --canvas: #0a0a0a; --surface: #111111; --border: #262626;
    --text: #ededed; --muted: #8f8f8f; --accent: #2cc48c; --accent-text: #5fd3a5; --danger: #f0716a;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --canvas: #0a0a0a; --surface: #111111; --border: #262626;
      --text: #ededed; --muted: #8f8f8f; --accent: #2cc48c; --accent-text: #5fd3a5; --danger: #f0716a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box }
  body {
    display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px;
    background: var(--canvas); color: var(--text);
    font: 14px/1.6 Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 400px; padding: 36px 32px 32px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  }
  .mark { display: block; width: 40px; height: 40px; margin: 0 auto 20px }
  .mark .core { fill: var(--text) }
  .spinner {
    width: 20px; height: 20px; margin: 0 auto 16px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 22%, transparent); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  .failed .spinner { display: none }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em }
  p { margin: 0; color: var(--muted) }
  .err { color: var(--danger) }
  .back {
    display: none; margin-top: 20px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); text-decoration: none; font-weight: 500;
  }
  .back:hover { border-color: var(--accent-text); color: var(--accent-text) }
  .failed .back { display: inline-block }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s } }
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <svg class="mark" viewBox="0 0 512 512" fill="none" aria-hidden="true"><path d="M256 202.24C272.38 174.59 349.18 103.99 330.9 70.3A48.13 48.13 0 0 1 271.22 70.3C252.93 103.99 262.14 174.59 256 202.24Z" fill="#045e3f"/><path d="M302.56 229.12C334.69 229.48 434.24 260.69 454.27 228.01A48.13 48.13 0 0 1 424.43 176.33C386.11 177.33 329.57 220.62 302.56 229.12Z" fill="#067647"/><path d="M302.56 282.88C318.31 310.89 341.05 412.71 379.38 413.71A48.13 48.13 0 0 1 409.21 362.03C389.18 329.35 323.43 302.02 302.56 282.88Z" fill="#0a9055"/><path d="M256 309.76C239.62 337.41 162.82 408.01 181.1 441.7A48.13 48.13 0 0 1 240.78 441.7C259.07 408.01 249.86 337.41 256 309.76Z" fill="#0fb477"/><path d="M209.44 282.88C177.31 282.52 77.76 251.31 57.73 283.99A48.13 48.13 0 0 1 87.57 335.67C125.89 334.67 182.43 291.38 209.44 282.88Z" fill="#1bc98c"/><path d="M209.44 229.12C193.69 201.11 170.95 99.29 132.62 98.29A48.13 48.13 0 0 1 102.79 149.97C122.82 182.65 188.57 209.98 209.44 229.12Z" fill="#34d399"/><circle class="core" cx="256" cy="256" r="30"/></svg>
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="t">正在完成登录…</h1>
  <p id="m">请稍候，马上进入控制台。</p>
  <a class="back" href="/v6.html">返回首页</a>
</main>
<script src="/config.js"></script>
<script src="/skin-api.js"></script>
<script src="/oauth-callback.js"></script>
</body>
</html>
