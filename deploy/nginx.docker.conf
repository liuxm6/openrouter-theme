# aitokensflux Skin —— Docker 内同源反代：/ → 静态文件，/api/* 与 /v1/* → new-api:3000
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.html$       { expires -1; }
    location = /config.js     { expires -1; }
    location ~* \.(?:js|css)$ { expires 30d; }

    # OAuth 回调页（provider 跳转回 /oauth/<provider>?code&state）
    location /oauth/ {
        try_files /oauth-callback.html =404;
    }

    location /api/ {
        proxy_pass http://new-api:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://new-api:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
