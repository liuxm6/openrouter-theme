# aitokensflux Skin 同源部署示例：同一域名下提供静态文件并转发 /api/* 与 /v1/*。
server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.example.com;
    ssl_certificate     /etc/nginx/certs/example.com.pem;
    ssl_certificate_key /etc/nginx/certs/example.com.key;

    root  /srv/aitokensflux-skin/current;
    index index.html;
    gzip  on;
    gzip_types text/css application/javascript text/javascript;

    # 安全响应头：写在 server 级，location 内不要重复 add_header（否则上级失效）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* \.html$       { expires -1; }
    location = /config.js     { expires -1; }
    location ~* \.(?:js|css)$ { expires 30d; }
    location ~* \.woff2$     { expires 365d; }

    # OAuth 回调页（provider 跳转回 /oauth/<provider>?code&state）
    location /oauth/ {
        try_files /oauth-callback.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAI 兼容接口：用户应用用 sk- 密钥调用
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
