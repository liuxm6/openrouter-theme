# aitokensflux Skin + new-api Platform + PostgreSQL —— 本机 Docker 一键部署。
#
# 用法（在仓库根目录）：
#   sh deploy/docker.sh            # 构建发布包并 docker compose up -d
#   或：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 访问：http://localhost:8080        （Skin，经 nginx 同源反代）
# Platform API：http://localhost:8080/api/*  与  /v1/*
#
# new-api 默认使用镜像 calciumion/new-api:latest；
# 使用本地源码构建时：
#   NEW_API_SRC=/path/to/new-api docker compose -f deploy/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:15
    container_name: aitokensflux-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [aitokensflux]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-new-api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: aitokensflux-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    networks: [aitokensflux]

  new-api:
    image: calciumion/new-api:latest
    # 使用本地源码构建：NEW_API_SRC=/path/to/new-api sh deploy/docker.sh
    build: ${NEW_API_SRC:-.}
    container_name: aitokensflux-new-api
    restart: always
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-123456}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=aitokensflux-node-1
      # 本机 HTTP 联调：关闭 Secure Cookie / OriginGuard；上线 HTTPS 时设为 true 并配 TRUSTED_URL
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      # 三方登录（在 Platform 后台或环境变量中开启；回调地址 = http://localhost:8080/oauth/<provider>）
      - GITHUB_OAUTH=${GITHUB_OAUTH:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - DISCORD_OAUTH=${DISCORD_OAUTH:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - LINUXDO_OAUTH=${LINUXDO_OAUTH:-}
      - LINUXDO_CLIENT_ID=${LINUXDO_CLIENT_ID:-}
      - LINUXDO_CLIENT_SECRET=${LINUXDO_CLIENT_SECRET:-}
      # Turnstile（可选）
      - TURNSTILE_CHECK=${TURNSTILE_CHECK:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    networks: [aitokensflux]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  skin:
    image: nginx:alpine
    container_name: aitokensflux-skin
    restart: always
    ports:
      - "${SKIN_PORT:-8088}:80"
    volumes:
      - ../dist/current:/usr/share/nginx/html:ro
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      new-api: { condition: service_healthy }
    networks: [aitokensflux]

volumes:
  pg_data:

networks:
  aitokensflux:
    driver: bridge
