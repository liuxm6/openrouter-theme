name: contract-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-chrome@v2
      - run: node scripts/skin-contract-test.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path || '/usr/bin/google-chrome' }}
