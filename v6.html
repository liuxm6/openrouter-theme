    .route-field {
      position: absolute;
      inset: 28px 0 0;
      pointer-events: none;
    }

    .route-field::before {
      position: absolute;
      top: 24px;
      right: 10%;
      bottom: 44px;
      left: 10%;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 80px 80px;
      content: "";
      mask-image: linear-gradient(to bottom, transparent, var(--text) 34%, var(--text) 82%, transparent);
      opacity: 0.38;
    }

    .route-field svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .route-trace {
      fill: none;
      stroke: #abefc6;
      stroke-linecap: round;
      stroke-width: 1.25;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      vector-effect: non-scaling-stroke;

    .premium-home.route-connected .route-trace {

    .route-origin {

      color: var(--accent-soft);

    .route-origin b,
    .route-provider b {
      display: grid;
      width: 24px;

      place-items: center;
      border-radius: 6px;
      background: var(--accent-faint);
      color: var(--accent-soft);

    .route-origin small,
